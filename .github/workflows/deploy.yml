# Builds the app and publishes it on GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # A repository named "<owner>.github.io" is served at the site root; any other
      # repository at "/<repository>/".
      - name: Work out the site address
        run: |
          repo="${{ github.event.repository.name }}"
          owner="${{ github.repository_owner }}"
          owner="${owner,,}"
          if [[ "$repo" == *.github.io ]]; then base="/"; else base="/$repo/"; fi
          echo "BASE_PATH=$base" >> "$GITHUB_ENV"
          echo "SITE_URL=https://$owner.github.io$base" >> "$GITHUB_ENV"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
